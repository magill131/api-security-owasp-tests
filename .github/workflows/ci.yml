name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Functional, security and meta tests
        run: python -m pytest

      - name: Security report (plants each weakness in turn; fails if one is missed)
        run: python scripts/security_report.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report
          path: docs/security_report.md
